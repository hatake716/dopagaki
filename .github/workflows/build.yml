name: build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Secrets が未設定なら KEYSTORE_PATH を出力せず、debug 署名でビルドだけ通す（SPEC.md §7）
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dopagaki.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/dopagaki.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_BASE64 が未設定のため debug 署名でビルドします（Release への添付はスキップ）"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # debug 署名フォールバック時は公開しない。鍵がビルドごとに変わり、
      # 上書きインストール不能な APK が配布されてしまうため（SPEC.md §7）
      - name: Attach APK to release
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
